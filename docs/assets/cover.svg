<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the OpenMediaVault integration for Gladys Assistant
       (illustration, not the openmediavault logo). Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#18304d"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a60"/>
      <stop offset="1" stop-color="#253246"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2433"/>
      <stop offset="1" stop-color="#121a26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fa8ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5fa8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#1f3550" stroke-width="1">
    <path d="M0 89 H800 M0 178 H800 M0 267 H800 M0 356 H800 M0 445 H800"/>
    <path d="M100 0 V534 M200 0 V534 M300 0 V534 M400 0 V534 M500 0 V534 M600 0 V534 M700 0 V534"/>
  </g>

  <circle cx="300" cy="250" r="230" fill="url(#glow)"/>

  <!-- the NAS: four drive bays -->
  <rect x="150" y="90" width="300" height="320" rx="22" fill="url(#case)" stroke="#5b6b84" stroke-width="3"/>
  <rect x="172" y="112" width="256" height="18" rx="6" fill="#1a2433"/>
  <circle cx="190" cy="121" r="5" fill="#58c98b"/>
  <circle cx="208" cy="121" r="5" fill="#5fa8ff"/>
  <g>
    <rect x="172" y="146" width="256" height="52" rx="8" fill="url(#bay)" stroke="#45556d" stroke-width="2"/>
    <rect x="172" y="208" width="256" height="52" rx="8" fill="url(#bay)" stroke="#45556d" stroke-width="2"/>
    <rect x="172" y="270" width="256" height="52" rx="8" fill="url(#bay)" stroke="#45556d" stroke-width="2"/>
    <rect x="172" y="332" width="256" height="52" rx="8" fill="url(#bay)" stroke="#45556d" stroke-width="2"/>
  </g>
  <g stroke="#2e3c52" stroke-width="3" stroke-linecap="round">
    <path d="M196 172 H330 M196 234 H330 M196 296 H330 M196 358 H330"/>
  </g>
  <g>
    <circle cx="400" cy="172" r="8" fill="#58c98b"/>
    <circle cx="400" cy="234" r="8" fill="#58c98b"/>
    <circle cx="400" cy="296" r="8" fill="#f2b33d"/>
    <circle cx="400" cy="358" r="8" fill="#4a5a72"/>
  </g>

  <!-- usage gauge, right -->
  <g transform="translate(590 205)">
    <circle r="92" fill="none" stroke="#24364f" stroke-width="22"/>
    <path d="M0 -92 A92 92 0 1 1 -87.5 28.4" fill="none" stroke="#5fa8ff" stroke-width="22" stroke-linecap="round"/>
    <text y="12" fill="#e8eef7" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle">72 %</text>
  </g>
  <!-- temperature and health chips -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="20" text-anchor="middle">
    <rect x="500" y="330" width="180" height="40" rx="20" fill="#1d3b2c" stroke="#58c98b" stroke-width="2"/>
    <text x="590" y="357" fill="#8fe3b4">S.M.A.R.T. OK</text>
    <rect x="500" y="382" width="180" height="40" rx="20" fill="#1c2c45" stroke="#5fa8ff" stroke-width="2"/>
    <text x="590" y="409" fill="#a9cdff">36 °C</text>
  </g>

  <!-- title -->
  <text x="400" y="478" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="bold" text-anchor="middle">OpenMediaVault</text>
  <text x="400" y="512" fill="#9fb4cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" text-anchor="middle">for Gladys Assistant</text>
